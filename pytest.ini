[pytest]
pythonpath = src
testpaths = tests/python
addopts = -ra --strict-markers -q
markers =
    unit: Fast, pure-logic tests of a single control.
    integration: Full custody pipeline / multi-control tests.
    assurance: Breach & Attack Simulation harness tests.
    onchain: Live on-chain tests (require CAL_ONCHAIN_RPC_URL + web3; opt-in).
    e2e: End-to-end UI tests (Playwright, run separately).
