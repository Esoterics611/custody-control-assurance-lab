[project]
name = "custody-control-assurance-lab"
version = "0.1.0"
description = "Defensive Breach & Attack Simulation lab validating the governance controls of a mock institutional digital-asset custody platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.5",
    "allure-pytest>=2.13",
    "ruff>=0.4",
    "black>=24.4",
]

[project.optional-dependencies]
# Optional: the live on-chain assurance target (reads PUBLIC testnet contracts).
# Install with `uv sync --extra onchain`. The core lab never imports web3 unless
# the on-chain target is actually used, so this stays out of the default install.
onchain = [
    "web3>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The HTML report is a single inline template; long lines are intentional and
# more readable kept whole than wrapped.
"src/cal/assurance/report.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
