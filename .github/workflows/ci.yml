name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint + pytest + assurance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to the code-scanning / Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff + black)
        run: |
          uv run ruff check src tests scripts
          uv run black --check src tests scripts

      - name: Run tests
        run: uv run pytest -n auto

      - name: Run assurance harness (writes report + Navigator/SARIF/JUnit exports)
        run: uv run python scripts/run_assurance.py

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/assurance.sarif
        continue-on-error: true

      - name: Upload assurance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-report
          path: |
            reports/assurance.html
            reports/navigator-layer.json
            reports/assurance.sarif
            reports/assurance-junit.xml
          if-no-files-found: ignore

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: tests/e2e
        run: npx playwright test

  pages:
    name: publish assurance report
    needs: python
    # Deploys only on push to main — i.e. when a PR is MERGED. Pull requests run the
    # python + e2e validation jobs above but skip this deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize deploys so two quick merges can't race the Pages environment.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the live assurance report site
        run: |
          uv sync
          uv run python scripts/run_assurance.py
          mkdir -p site
          cp reports/assurance.html site/index.html
          cp reports/navigator-layer.json reports/assurance.sarif reports/assurance-junit.xml site/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
